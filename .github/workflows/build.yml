name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  NDK_VERSION: "27.2.12479018"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # ---------- hev-socks5-tunnel (.so, 4 ABI: arm64-v8a, armeabi-v7a, x86, x86_64) ----------
      - name: Restore cached libhev-socks5-tunnel
        id: cache-hev
        uses: actions/cache@v4
        with:
          path: hev-libs
          key: hev-${{ runner.os }}-ndk${{ env.NDK_VERSION }}-v1

      - name: Build libhev-socks5-tunnel
        if: steps.cache-hev.outputs.cache-hit != 'true'
        run: |
          git clone --recursive --depth 1 https://github.com/heiher/hev-socks5-tunnel.git
          cd hev-socks5-tunnel
          "$NDK_HOME/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            "APP_ABI=armeabi-v7a arm64-v8a x86 x86_64" \
            APP_PLATFORM=android-26 \
            NDK_LIBS_OUT="$GITHUB_WORKSPACE/hev-libs" \
            NDK_OUT=/tmp/hev-obj \
            clean all
          ls -R "$GITHUB_WORKSPACE/hev-libs"

      - name: Copy libhev-socks5-tunnel into app
        run: |
          mkdir -p app/src/main/jniLibs
          cp -r hev-libs/* app/src/main/jniLibs/
          find app/src/main/jniLibs -name '*.so'

      # ---------- dnstt-client (DNS tunnel), packaged as libdnstt.so ----------
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build dnstt-client
        run: |
          git clone --depth 1 https://www.bamsoftware.com/git/dnstt.git \
            || git clone --depth 1 https://github.com/tladesignz/dnstt.git dnstt
          cd dnstt/dnstt-client
          build() { # abi goarch goarm
            mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/$1"
            CGO_ENABLED=0 GOOS=linux GOARCH=$2 GOARM=$3 go build -trimpath -ldflags="-s -w" \
              -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/$1/libdnstt.so" .
          }
          build arm64-v8a arm64 ""
          build armeabi-v7a arm 7
          build x86_64 amd64 ""
          build x86 386 ""
          find "$GITHUB_WORKSPACE/app/src/main/jniLibs" -name 'libdnstt.so'

      # ---------- Xray core (libv2ray.aar) ----------
      - name: Download libv2ray.aar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          gh release download --repo 2dust/AndroidLibXrayLite \
            --pattern 'libv2ray.aar' --dir app/libs --clobber
          ls -lh app/libs

      # ---------- Gradle build ----------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoraTunnel-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
